<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>INTUBATALK · Patient</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/patient.css">
</head>
<body>

<section id="wizard" class="hidden">
  <div class="gate">
    <nav class="role-nav" aria-label="Role selector" style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge mint" style="padding:6px 14px;font-size:13px;font-weight:700">👤 Patient Tablet</span>
      <a class="badge" href="/nurse" style="padding:6px 14px;font-size:13px;font-weight:700;text-decoration:none;color:var(--text-soft)">🩺 Switch to Nurse Dashboard →</a>
      <a class="badge" href="/dual" style="padding:6px 14px;font-size:13px;font-weight:700;text-decoration:none;color:var(--text-soft)">👥 Dual Simulator →</a>
    </nav>
    <div class="gate-logo">
      <div class="brand-mark" id="gateMark" aria-hidden="true"></div>
      <h1>INTUBATALK</h1>
      <p class="tag">Speak without a voice. Touch, spell, blink, alert.</p>
    </div>
    <form class="clay gate-card" id="gateForm">
      <div>
        <label for="inName">Patient name</label>
        <input id="inName" autocomplete="name" placeholder="e.g. Maria" required>
      </div>
      <div>
        <label for="inBed">Bed or room number <span style="font-weight:500">(optional)</span></label>
        <input id="inBed" inputmode="text" placeholder="e.g. 204">
      </div>
      <p class="hint">A four digit room code gets created so a nurse dashboard can pair with this tablet.</p>
      <div class="gate-err hidden" id="errGate"></div>
      <button type="submit" class="btn btn-mint gate-cta" id="btnCreate">Start communication tablet</button>
    </form>
  </div>
</section>

<section id="app" class="p-app hidden" aria-live="polite">
  <header class="p-top">
    <div class="brand">
      <div class="brand-mark" id="topMark" aria-hidden="true"></div>
      <div>
        <p class="brand-name" id="topName">Patient</p>
        <span class="badge" id="topRoom" style="margin-top:2px">Room code · bed</span>
      </div>
    </div>
    <div class="p-status">
      <span id="capsChips" style="display:contents"></span>
      <button class="btn btn-ghost btn-sm" id="btnDial"><span data-ic="bell"></span>Call nurse</button>
      <button class="btn btn-ghost btn-sm" id="btnCapsTop"><span data-ic="abilities"></span>Abilities</button>
      <button class="btn btn-ghost btn-sm" id="btnBoard"><span data-ic="board"></span>Board</button>
      <button class="btn btn-ghost btn-sm" id="btnStartOver" title="Start a fresh session from the beginning"><span data-ic="repeat"></span>Start over</button>
    </div>
  </header>

  <div class="p-main" id="mainHome">
    <div class="tiles" id="homeGrid" role="group" aria-label="Needs"></div>
  </div>

  <div class="p-panel hidden" id="panel"></div>
</section>

<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<script type="module" src="/js/patient.js"></script>
</body>
</html>

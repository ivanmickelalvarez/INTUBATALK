<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Run the INTUBATALK patient tablet and nurse dashboard side by side in one window. Ideal for ward training and program demos.">
<meta name="color-scheme" content="light">
<title>INTUBATALK · Dual Interactive Simulator</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Lora:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Lora:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/css/base.css">
<style>
:root {
  --top-h: 56px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-ui); height: 100vh; height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
.dual-bar {
  min-height: var(--top-h); background: rgba(243, 241, 236, .92);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 14px; gap: 8px; z-index: 10; flex: none; flex-wrap: wrap;
}
.dual-brand {
  display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--text);
}
.dual-brand .brand-mark {
  width: 34px; height: 34px; border-radius: 11px;
  background: linear-gradient(145deg, #4cb1a0, #379180);
  box-shadow: var(--clay-sm); display: flex; align-items: center; justify-content: center; color: #fff;
  flex-shrink: 0;
}
.dual-brand .brand-mark svg { width: 18px; height: 18px; }
.dual-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.dual-sub { color: var(--text-soft); font-size: 12.5px; font-weight: 500; }
.dual-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dual-split {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
  background: #000; gap: 2px;
}
@media (max-width: 900px) {
  .dual-split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
@media (max-width: 768px) {
  .dual-sub { display: none; }
  .dual-actions .btn-sm { padding: 4px 8px; font-size: 11.5px; }
}
.pane-wrap {
  position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden;
}
.pane-hdr {
  position: absolute; top: 8px; right: 8px; z-index: 5;
  background: rgba(255,255,255,.8); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 700;
  color: var(--text-soft); box-shadow: var(--clay-sm); pointer-events: none;
}
iframe {
  width: 100%; height: 100%; border: none; display: block;
}
</style>
</head>
<body>

<header class="dual-bar">
  <div class="dual-brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-2 3-4 4.5-4 8a4 4 0 0 0 8 0c0-3.5-2-5-4-8z"/><rect x="6" y="17" width="12" height="4" rx="2"/><path d="M9 19h.01M12 19h.01M15 19h.01"/></svg>
    </div>
    <div>
      <span class="dual-title">INTUBATALK</span>
      <span class="dual-sub">· Dual Interactive Presentation Simulator</span>
    </div>
  </div>

  <div class="dual-actions">
    <button class="btn btn-ghost btn-sm" id="btnSyncBoth" title="Sync both views">🔄 Reload sync</button>
    <a class="btn btn-ghost btn-sm" href="/" target="_blank">Patient tablet ↗</a>
    <a class="btn btn-ghost btn-sm" href="/nurse" target="_blank">Nurse dashboard ↗</a>
    <a class="btn btn-ghost btn-sm" href="/board" target="_blank">Printable board ↗</a>
    <a class="btn btn-ghost btn-sm" href="/choose" target="_blank">Role chooser ↗</a>
  </div>
</header>

<main class="dual-split">
  <div class="pane-wrap">
    <div class="pane-hdr">PATIENT TABLET (TOUCH / VOICE / TILES)</div>
    <iframe id="framePatient" src="/" title="Patient Tablet" allow="camera; microphone"></iframe>
  </div>
  <div class="pane-wrap">
    <div class="pane-hdr">NURSE STATION (REAL-TIME ALERTS & LOG)</div>
    <iframe id="frameNurse" src="/nurse" title="Nurse Dashboard" allow="camera; microphone"></iframe>
  </div>
</main>

<script>
document.getElementById("btnSyncBoth").addEventListener("click", () => {
  document.getElementById("framePatient").src = "/";
  document.getElementById("frameNurse").src = "/nurse";
});
</script>
</body>
</html>
